spring.application.name=online-shopping

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopping_db}
spring.datasource.username=${DB_USER:shopping_user}
spring.datasource.password=${DB_PASSWORD:shopping123}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always